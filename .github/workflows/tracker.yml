name: Flight Price Tracker

on:
  schedule:
    # UTC 기준 (한국 시간 = UTC + 9시간)
    # 아래 설정은 한국 시간 기준 매일 09:00, 18:00 (UTC 00:00, 09:00)에 실행
    - cron: '0 0,9 * * *'
  workflow_dispatch: # 갤럭시 폰에서 수동으로 버튼 눌러 테스트해볼 수 있는 옵션

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install requests

      - name: 항공권 추적 스크립트 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
